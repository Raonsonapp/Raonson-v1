name: raonson
description: Raonson social app
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.2

  http: ^1.2.0
  dio: ^5.4.3
  intl: ^0.19.0

  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3
  
  flutter_image_compress: ^2.1.0
  video_compress: ^3.1.2

  video_player: ^2.8.6
  image_picker: ^1.0.7
  photo_manager: ^3.6.4
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  flutter_staggered_grid_view: ^0.7.0
  webview_flutter: ^4.4.2

  cupertino_icons: ^1.0.6
  material_symbols_icons: ^4.2745.0
  shimmer: ^3.0.0

  share_plus: ^10.0.2
  uuid: ^4.4.0
  path_provider: ^2.1.2
  audioplayers: ^6.1.0
  url_launcher: ^6.3.0
  http_parser: ^4.0.2
  connectivity_plus: ^6.0.5
  internet_connection_checker_plus: ^2.5.0

  firebase_core: ^3.6.0
  firebase_auth: ^5.1.0
  firebase_storage: ^12.3.0
  firebase_messaging: ^15.1.0

  country_picker: ^2.0.26
  country_code_picker: ^3.0.0

  web_socket_channel: ^2.4.0
  agora_rtc_engine: ^6.3.2
  permission_handler: ^11.3.1
  flutter_contacts: ^1.1.9+2

  # Паёмҳои овозӣ. 5.0.x + interface 1.2.0 — маҷмӯаи мувофиқ, то
  # record_linux (startStream) build-и Android-ро вайрон накунад.
  record: 5.0.5

  yandex_mobileads: ^7.0.0

# record_linux 0.7.2 startStream-и interface 1.3.0-ро надорад → build шикаст
# мехӯрад. Тамоми оила ба версияи пеш-аз-startStream маҳкам мешавад.
dependency_overrides:
  record_platform_interface: 1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/icon.png

flutter:
  uses-material-design: true

  assets:
    - assets/icon.png
    - assets/icons/

  fonts:
    - family: RaonsonFont
      fonts:
        - asset: assets/fonts/Billabong.ttf
