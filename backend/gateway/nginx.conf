limit_req_zone $binary_remote_addr zone=auth_zone:10m   rate=20r/m;
limit_req_zone $binary_remote_addr zone=api_zone:50m    rate=200r/m;
limit_req_zone $binary_remote_addr zone=upload_zone:10m rate=10r/m;

upstream auth_svc         { server auth-service:8001;         keepalive 32; }
upstream post_svc         { server post-service:8002;         keepalive 64; }
upstream feed_svc         { server feed-service:8003;         keepalive 64; }
upstream user_svc         { server user-service:8004;         keepalive 32; }
upstream realtime_svc     { server realtime-service:8005;     keepalive 128;}
upstream notification_svc { server notification-service:8006; keepalive 16; }

server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 500;

    add_header X-Frame-Options "DENY";
    add_header X-Content-Type-Options "nosniff";

    # ── Health ────────────────────────────────────────────────
    location = /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # ── WebSocket ─────────────────────────────────────────────
    location /ws {
        proxy_pass http://realtime_svc;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── AUTH — strict rate limit ──────────────────────────────
    location /auth/login    { limit_req zone=auth_zone burst=5 nodelay; proxy_pass http://auth_svc; include /etc/nginx/proxy.conf; }
    location /auth/register { limit_req zone=auth_zone burst=5 nodelay; proxy_pass http://auth_svc; include /etc/nginx/proxy.conf; }
    location /auth {
        proxy_pass http://auth_svc;
        include /etc/nginx/proxy.conf;
    }

    # ── FEED ──────────────────────────────────────────────────
    location /feed {
        limit_req zone=api_zone burst=30 nodelay;
        auth_request /internal/auth;
        auth_request_set $uid $upstream_http_x_user_id;
        proxy_set_header X-User-ID $uid;
        proxy_pass http://feed_svc;
        include /etc/nginx/proxy.conf;
    }

    # ── POSTS ─────────────────────────────────────────────────
    location /posts {
        limit_req zone=api_zone burst=40 nodelay;
        auth_request /internal/auth;
        auth_request_set $uid $upstream_http_x_user_id;
        proxy_set_header X-User-ID $uid;
        proxy_pass http://post_svc;
        include /etc/nginx/proxy.conf;
    }

    location /comments {
        limit_req zone=api_zone burst=30 nodelay;
        auth_request /internal/auth;
        auth_request_set $uid $upstream_http_x_user_id;
        proxy_set_header X-User-ID $uid;
        proxy_pass http://post_svc;
        include /etc/nginx/proxy.conf;
    }

    # ── USERS / PROFILE / SEARCH / FOLLOW ─────────────────────
    location ~ ^/(users|profile|follow|search) {
        limit_req zone=api_zone burst=30 nodelay;
        auth_request /internal/auth;
        auth_request_set $uid $upstream_http_x_user_id;
        proxy_set_header X-User-ID $uid;
        proxy_pass http://user_svc;
        include /etc/nginx/proxy.conf;
    }

    # ── NOTIFICATIONS ─────────────────────────────────────────
    location /notifications {
        limit_req zone=api_zone burst=20 nodelay;
        auth_request /internal/auth;
        auth_request_set $uid $upstream_http_x_user_id;
        proxy_set_header X-User-ID $uid;
        proxy_pass http://notification_svc;
        include /etc/nginx/proxy.conf;
    }

    # ── Auth subrequest ───────────────────────────────────────
    location = /internal/auth {
        internal;
        proxy_pass http://auth_svc/internal/validate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Auth-Token $http_authorization;
    }

    error_page 429 /429.json;
    location = /429.json {
        return 429 '{"error":"Too many requests"}';
        add_header Content-Type application/json;
    }
    error_page 502 503 /50x.json;
    location = /50x.json {
        return 503 '{"error":"Service unavailable"}';
        add_header Content-Type application/json;
    }
}
