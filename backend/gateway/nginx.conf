# ── Rate limit zones ─────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=auth_zone:10m    rate=20r/m;
limit_req_zone $binary_remote_addr zone=api_zone:50m     rate=200r/m;
limit_req_zone $binary_remote_addr zone=upload_zone:10m  rate=10r/m;
limit_req_zone $binary_remote_addr zone=ws_zone:5m       rate=10r/m;

# ── Upstream definitions with keepalive ───────────────────────────
upstream auth_svc         { server auth-service:8001;         keepalive 32; }
upstream post_svc         { server post-service:8002;         keepalive 64; }
upstream feed_svc         { server feed-service:8003;         keepalive 64; }
upstream user_svc         { server user-service:8004;         keepalive 32; }
upstream realtime_svc     { server realtime-service:8005;     keepalive 128; }
upstream notification_svc { server notification-service:8006; keepalive 16; }

server {
    listen 80;
    server_name _;

    # ── Compression ───────────────────────────────────────────
    gzip on;
    gzip_types application/json text/plain application/javascript;
    gzip_min_length 500;
    gzip_comp_level 5;

    # ── Security headers ──────────────────────────────────────
    add_header X-Frame-Options       "DENY"            always;
    add_header X-Content-Type-Options "nosniff"        always;
    add_header X-XSS-Protection      "1; mode=block"   always;
    add_header Referrer-Policy       "no-referrer"     always;

    client_max_body_size 50M;

    # ── Health check — no auth, no rate limit ─────────────────
    location = /health {
        access_log off;
        return 200 '{"status":"ok","gateway":"nginx"}';
        add_header Content-Type application/json;
    }

    # ── WebSocket — realtime-service ──────────────────────────
    location /ws {
        limit_req zone=ws_zone burst=5 nodelay;

        proxy_pass http://realtime_svc;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 5s;
    }

    # ── AUTH — strict rate limit, no JWT check ────────────────
    location ~ ^/auth/(login|register|forgot-password|reset-password) {
        limit_req zone=auth_zone burst=5 nodelay;
        proxy_pass http://auth_svc;
        include /etc/nginx/proxy.conf;
        proxy_read_timeout 10s;
    }

    location /auth {
        proxy_pass http://auth_svc;
        include /etc/nginx/proxy.conf;
    }

    # ── FEED ──────────────────────────────────────────────────
    location /feed {
        limit_req zone=api_zone burst=30 nodelay;
        auth_request      /internal/validate;
        auth_request_set  $uid $upstream_http_x_user_id;
        proxy_set_header  X-User-ID $uid;
        proxy_pass        http://feed_svc;
        include /etc/nginx/proxy.conf;
    }

    # ── POSTS ─────────────────────────────────────────────────
    location /posts {
        limit_req zone=api_zone burst=40 nodelay;
        auth_request      /internal/validate;
        auth_request_set  $uid $upstream_http_x_user_id;
        proxy_set_header  X-User-ID $uid;
        proxy_pass        http://post_svc;
        include /etc/nginx/proxy.conf;
        proxy_read_timeout 30s;
    }

    location /comments {
        limit_req zone=api_zone burst=30 nodelay;
        auth_request      /internal/validate;
        auth_request_set  $uid $upstream_http_x_user_id;
        proxy_set_header  X-User-ID $uid;
        proxy_pass        http://post_svc;
        include /etc/nginx/proxy.conf;
    }

    # Upload — stricter limit
    location ~ ^/posts$ {
        if ($request_method = POST) {
            limit_req zone=upload_zone burst=3 nodelay;
        }
        auth_request      /internal/validate;
        auth_request_set  $uid $upstream_http_x_user_id;
        proxy_set_header  X-User-ID $uid;
        proxy_pass        http://post_svc;
        include /etc/nginx/proxy.conf;
        proxy_read_timeout 60s;
    }

    # ── USERS / PROFILE / FOLLOW / SEARCH ─────────────────────
    location ~ ^/(users|profile|follow|search) {
        limit_req zone=api_zone burst=30 nodelay;
        auth_request      /internal/validate;
        auth_request_set  $uid $upstream_http_x_user_id;
        proxy_set_header  X-User-ID $uid;
        proxy_pass        http://user_svc;
        include /etc/nginx/proxy.conf;
    }

    # ── NOTIFICATIONS ─────────────────────────────────────────
    location /notifications {
        limit_req zone=api_zone burst=20 nodelay;
        auth_request      /internal/validate;
        auth_request_set  $uid $upstream_http_x_user_id;
        proxy_set_header  X-User-ID $uid;
        proxy_pass        http://notification_svc;
        include /etc/nginx/proxy.conf;
    }

    # ── Internal auth subrequest (nginx auth_request) ─────────
    # Not exposed to public
    location = /internal/validate {
        internal;
        proxy_pass              http://auth_svc/internal/validate;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        X-Auth-Token $http_authorization;
        proxy_cache_valid       200 30s;
        proxy_read_timeout      3s;
    }

    # ── Error pages ───────────────────────────────────────────
    error_page 401 /401.json;
    location = /401.json {
        internal;
        return 401 '{"success":false,"error":{"code":"UNAUTHORIZED","message":"Authentication required"}}';
        add_header Content-Type application/json;
    }

    error_page 429 /429.json;
    location = /429.json {
        internal;
        return 429 '{"success":false,"error":{"code":"RATE_LIMITED","message":"Too many requests. Please slow down."}}';
        add_header Content-Type application/json;
    }

    error_page 502 503 504 /50x.json;
    location = /50x.json {
        internal;
        return 503 '{"success":false,"error":{"code":"SERVICE_UNAVAILABLE","message":"Service temporarily unavailable"}}';
        add_header Content-Type application/json;
    }
}
