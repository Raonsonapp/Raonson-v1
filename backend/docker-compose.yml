version: '3.9'

networks:
  raonson:
    driver: bridge

volumes:
  pg_data:
  redis_data:

services:

  # ── POSTGRESQL ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       raonson
      POSTGRES_USER:     raonson
      POSTGRES_PASSWORD: ${DB_PASSWORD:-raonson_pass}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks: [raonson]
    restart: always
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U raonson"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── REDIS ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-redispass}
    volumes:
      - redis_data:/data
    networks: [raonson]
    restart: always
    healthcheck:
      test: ["CMD","redis-cli","-a","${REDIS_PASSWORD:-redispass}","ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── 1. AUTH SERVICE ───────────────────────────────────────────
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    environment:
      PORT:              "8001"
      DATABASE_URL:      postgres://raonson:${DB_PASSWORD:-raonson_pass}@postgres:5432/raonson?sslmode=disable
      REDIS_URL:         redis://:${REDIS_PASSWORD:-redispass}@redis:6379/0
      JWT_SECRET:        ${JWT_SECRET:-change_me_in_production}
      JWT_REFRESH_SECRET:${JWT_REFRESH_SECRET:-change_refresh_in_prod}
      APP_ENV:           ${APP_ENV:-development}
    depends_on:
      postgres: {condition: service_healthy}
      redis:    {condition: service_healthy}
    networks: [raonson]
    restart: always

  # ── 2. POST SERVICE ───────────────────────────────────────────
  post-service:
    build:
      context: ./post-service
      dockerfile: Dockerfile
    environment:
      PORT:                   "8002"
      DATABASE_URL:           postgres://raonson:${DB_PASSWORD:-raonson_pass}@postgres:5432/raonson?sslmode=disable
      REDIS_URL:              redis://:${REDIS_PASSWORD:-redispass}@redis:6379/0
      JWT_SECRET:             ${JWT_SECRET:-change_me_in_production}
      FEED_SERVICE_URL:       http://feed-service:8003
      NOTIFICATION_SERVICE_URL: http://notification-service:8006
    depends_on:
      postgres: {condition: service_healthy}
      redis:    {condition: service_healthy}
    networks: [raonson]
    restart: always

  # ── 3. FEED SERVICE ───────────────────────────────────────────
  feed-service:
    build:
      context: ./feed-service
      dockerfile: Dockerfile
    environment:
      PORT:        "8003"
      DATABASE_URL: postgres://raonson:${DB_PASSWORD:-raonson_pass}@postgres:5432/raonson?sslmode=disable
      REDIS_URL:    redis://:${REDIS_PASSWORD:-redispass}@redis:6379/0
      JWT_SECRET:   ${JWT_SECRET:-change_me_in_production}
    depends_on:
      postgres: {condition: service_healthy}
      redis:    {condition: service_healthy}
    networks: [raonson]
    restart: always

  # ── 4. USER SERVICE ───────────────────────────────────────────
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    environment:
      PORT:        "8004"
      DATABASE_URL: postgres://raonson:${DB_PASSWORD:-raonson_pass}@postgres:5432/raonson?sslmode=disable
      REDIS_URL:    redis://:${REDIS_PASSWORD:-redispass}@redis:6379/0
      JWT_SECRET:   ${JWT_SECRET:-change_me_in_production}
    depends_on:
      postgres: {condition: service_healthy}
      redis:    {condition: service_healthy}
    networks: [raonson]
    restart: always

  # ── 5. REALTIME SERVICE (WebSocket) ───────────────────────────
  realtime-service:
    build:
      context: ./realtime-service
      dockerfile: Dockerfile
    environment:
      PORT:       "8005"
      REDIS_URL:  redis://:${REDIS_PASSWORD:-redispass}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
    depends_on:
      redis: {condition: service_healthy}
    networks: [raonson]
    restart: always

  # ── 6. NOTIFICATION SERVICE ───────────────────────────────────
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    environment:
      PORT:                 "8006"
      DATABASE_URL:         postgres://raonson:${DB_PASSWORD:-raonson_pass}@postgres:5432/raonson?sslmode=disable
      REDIS_URL:            redis://:${REDIS_PASSWORD:-redispass}@redis:6379/0
      JWT_SECRET:           ${JWT_SECRET:-change_me_in_production}
      REALTIME_SERVICE_URL: http://realtime-service:8005
      FCM_SERVER_KEY:       ${FCM_SERVER_KEY:-}
    depends_on:
      postgres: {condition: service_healthy}
      redis:    {condition: service_healthy}
    networks: [raonson]
    restart: always

  # ── NGINX GATEWAY ─────────────────────────────────────────────
  gateway:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/proxy.conf:/etc/nginx/proxy.conf:ro
    depends_on:
      - auth-service
      - post-service
      - feed-service
      - user-service
      - realtime-service
      - notification-service
    networks: [raonson]
    restart: always
