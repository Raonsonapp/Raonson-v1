version: '3.9'

###############################################################
# RAONSON — 6 Microservices + Gateway
# docker-compose up -d
###############################################################

networks:
  raonson:
    driver: bridge

services:

  # ── API GATEWAY ─────────────────────────────────────────────
  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/ssl:/etc/ssl:ro
    depends_on:
      - auth-service
      - post-service
      - feed-service
      - user-service
      - realtime-service
      - notification-service
    networks:
      - raonson
    restart: always

  # ── 1. AUTH SERVICE ──────────────────────────────────────────
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    environment:
      - PORT=8001
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "8001:8001"
    networks:
      - raonson
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ── 2. POST SERVICE ──────────────────────────────────────────
  post-service:
    build:
      context: ./post-service
      dockerfile: Dockerfile
    environment:
      - PORT=8002
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - FEED_SERVICE_URL=http://feed-service:8003
      - NOTIFICATION_SERVICE_URL=http://notification-service:8006
      - R2_BUCKET=${R2_BUCKET}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY=${R2_ACCESS_KEY}
      - R2_SECRET_KEY=${R2_SECRET_KEY}
    ports:
      - "8002:8002"
    networks:
      - raonson
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ── 3. FEED SERVICE ──────────────────────────────────────────
  feed-service:
    build:
      context: ./feed-service
      dockerfile: Dockerfile
    environment:
      - PORT=8003
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    ports:
      - "8003:8003"
    networks:
      - raonson
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ── 4. USER SERVICE ──────────────────────────────────────────
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    environment:
      - PORT=8004
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    ports:
      - "8004:8004"
    networks:
      - raonson
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ── 5. REALTIME SERVICE (WebSocket) ──────────────────────────
  realtime-service:
    build:
      context: ./realtime-service
      dockerfile: Dockerfile
    environment:
      - PORT=8005
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "8005:8005"
    networks:
      - raonson
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
      # WebSocket-ро scale мекунем — Redis Pub/Sub sync мекунад
      replicas: 2

  # ── 6. NOTIFICATION SERVICE ───────────────────────────────────
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    environment:
      - PORT=8006
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - REALTIME_SERVICE_URL=http://realtime-service:8005
      - FCM_SERVER_KEY=${FCM_SERVER_KEY}
    ports:
      - "8006:8006"
    networks:
      - raonson
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
