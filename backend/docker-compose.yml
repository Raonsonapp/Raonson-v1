version: '3.9'

networks:
  raonson:
    driver: bridge

volumes:
  pg_data:
  redis_data:

x-common-env: &common-env
  DATABASE_URL: postgres://raonson:${DB_PASSWORD:-raonson_pass}@postgres:5432/raonson?sslmode=disable
  REDIS_URL: redis://:${REDIS_PASSWORD:-redispass}@redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-change_me_32_chars_minimum_here}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-refresh_32_chars_minimum_here}
  APP_ENV: ${APP_ENV:-development}

x-depends-on-infra: &depends-on-infra
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:

  # ── Infrastructure ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: raonson
      POSTGRES_USER: raonson
      POSTGRES_PASSWORD: ${DB_PASSWORD:-raonson_pass}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks: [raonson]
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raonson -d raonson"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-redispass}
      --save 60 1
      --loglevel warning
    volumes:
      - redis_data:/data
    networks: [raonson]
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispass}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── 1. Auth Service ───────────────────────────────────────────
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    environment:
      <<: *common-env
      PORT: "8001"
    <<: *depends-on-infra
    networks: [raonson]
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256M }

  # ── 2. Post Service ───────────────────────────────────────────
  post-service:
    build:
      context: ./post-service
      dockerfile: Dockerfile
    environment:
      <<: *common-env
      PORT: "8002"
      FEED_SERVICE_URL: http://feed-service:8003
      NOTIFICATION_SERVICE_URL: http://notification-service:8006
    <<: *depends-on-infra
    networks: [raonson]
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8002/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 512M }

  # ── 3. Feed Service ───────────────────────────────────────────
  feed-service:
    build:
      context: ./feed-service
      dockerfile: Dockerfile
    environment:
      <<: *common-env
      PORT: "8003"
    <<: *depends-on-infra
    networks: [raonson]
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8003/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: '0.75', memory: 256M }

  # ── 4. User Service ───────────────────────────────────────────
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    environment:
      <<: *common-env
      PORT: "8004"
    <<: *depends-on-infra
    networks: [raonson]
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8004/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256M }

  # ── 5. Realtime Service (WebSocket) ───────────────────────────
  realtime-service:
    build:
      context: ./realtime-service
      dockerfile: Dockerfile
    environment:
      PORT: "8005"
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispass}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change_me_32_chars_minimum_here}
      APP_ENV: ${APP_ENV:-development}
    depends_on:
      redis:
        condition: service_healthy
    networks: [raonson]
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8005/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 512M }

  # ── 6. Notification Service ───────────────────────────────────
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    environment:
      <<: *common-env
      PORT: "8006"
      REALTIME_SERVICE_URL: http://realtime-service:8005
      FCM_SERVER_KEY: ${FCM_SERVER_KEY:-}
    <<: *depends-on-infra
    networks: [raonson]
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8006/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: '0.25', memory: 128M }

  # ── Nginx Gateway ─────────────────────────────────────────────
  gateway:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/proxy.conf:/etc/nginx/proxy.conf:ro
    depends_on:
      auth-service:        { condition: service_healthy }
      post-service:        { condition: service_healthy }
      feed-service:        { condition: service_healthy }
      user-service:        { condition: service_healthy }
      realtime-service:    { condition: service_healthy }
      notification-service: { condition: service_healthy }
    networks: [raonson]
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 30s
