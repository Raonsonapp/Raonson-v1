name: Санҷиши сервер бо базаи ҳақиқӣ

# ═══════════════════════════════════════════════════════════════════
#  Қабати сеюми санҷиш.
#
#    flutter test        — мантиқи барнома
#    integration-test    — барнома дар эмулятори Android
#    ИН ҶО              — сервер бо PostgreSQL-и ҳақиқӣ
#
#  Ин ҷо сервер воқеан партофта мешавад, ду корбар сохта мешавад ва
#  ҳамаи ҷараёнҳо мегузаранд: пост бо музика, лайк, шарҳ, огоҳинома,
#  чат, стори, explore, кашф.
#
#  Маҳз ин қабат камбудиҳоеро мегирад, ки дигарон намебинанд:
#  музикаи пост сабт намешавад, паёми такрорӣ дукарата мешавад,
#  сервер «фиристода шуд» мегӯяд, вале чизе нафиристодааст.
# ═══════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
  push:
    branches: [claude/profile-settings-home-feed-N5ct0]
    paths:
      - 'backend/**'
      - '.github/workflows/api-test.yml'
  pull_request:
    paths:
      - 'backend/**'

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: raonson
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: backend/go.sum

      - name: Тестҳои воҳиди Go
        working-directory: backend
        run: go test ./...

      - name: Сохтани сервер
        working-directory: backend
        run: go build -o /tmp/raonson-server .

      # Ҳеҷ калиди ҳақиқӣ ин ҷо нест ва лозим ҳам не: санҷиш
      # мантиқи серверро мебинад, на FCM ё R2. Маҳз барои ҳамин
      # интизор аст, ки рамзи телефон 502 диҳад.
      - name: Партофтани сервер
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/raonson?sslmode=disable
          JWT_SECRET: ci-only-not-a-real-secret
          JWT_REFRESH_SECRET: ci-only-not-a-real-secret-2
          PORT: '8099'
          GIN_MODE: debug
          # Чор санҷиш пайдарпай кор мекунанд ва ҳар кадом корбари
          # нав месозад. Лимити `/auth` (20 дар дақиқа) дуруст аст ва
          # даст намехӯрад — танҳо дар ИН сервери санҷишӣ васеъ
          # карда мешавад. Дар продакшн ин тағйирёбанда нест.
          RATE_LIMIT_MULTIPLIER: '50'
          # Рамзи якдафъаина дар ҷавоб — ТАНҲО дар ин сервери санҷишӣ
          # (GIN_MODE: debug). Дар release сервер онро ҳеҷ гоҳ
          # барнамегардонад. Бе ин барқарорсозии парол санҷида намешавад.
          OTP_ECHO: '1'
        run: |
          /tmp/raonson-server > /tmp/server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8099/health > /dev/null 2>&1; then
              echo "сервер тайёр"; exit 0
            fi
            sleep 2
          done
          echo "::error::сервер дар 80 сония накушод"
          tail -50 /tmp/server.log
          exit 1

      - name: Ҳолати сервер
        run: curl -fsS http://127.0.0.1:8099/health

      - name: Санҷиши ҳамаи бахшҳо
        env:
          BASE: http://127.0.0.1:8099
          SUFFIX: ci${{ github.run_number }}
        run: python3 backend/testing/api_smoke.py

      # Оё корбари бегона ба моли ман даст расонда метавонад?
      # Маҳз ин санҷиш ду камбудиро ёфт: `pin` ҷавоби дурӯғ медод ва
      # соҳиби пост шарҳи нохушро нест карда наметавонист.
      - name: Санҷиши иҷозат
        env:
          BASE: http://127.0.0.1:8099
          SUFFIX: ci${{ github.run_number }}
        run: python3 backend/testing/api_authz.py

      # Бастан ва ҳисоби пӯшида. Ин санҷиш ШАШ камбудӣ ёфт: бастан
      # амалан танҳо ороиш буд ва қулфи ҳисоби пӯшида ҳеҷ маъно
      # надошт.
      - name: Санҷиши махфият
        env:
          BASE: http://127.0.0.1:8099
          SUFFIX: ci${{ github.run_number }}
        run: python3 backend/testing/api_privacy.py

      # Бахшҳои чуқур: оё он чи ваъда шудааст ВОҚЕАН мешавад?
      # Стории «дӯстони наздик» ба бегона нарасад, шарҳи дорои
      # калимаи пинҳон ба соҳиб нанамояд, паёми гурӯҳ ба ғайри аъзо
      # нарасад.
      - name: Санҷиши бахшҳои чуқур
        env:
          BASE: http://127.0.0.1:8099
          SUFFIX: ci${{ github.run_number }}
        run: python3 backend/testing/api_deep.py

      # Ҷараёнҳои амиқ: стори бо пурсиш, «Актуальный», танзимоти
      # ҳисоб, бойгонӣ, ҳаштаг. Маҳз ин санҷиш ошкор кард, ки
      # «Актуальный» умуман сохта намешуд.
      - name: Санҷиши ҷараёнҳои амиқ
        env:
          BASE: http://127.0.0.1:8099
          SUFFIX: ci${{ github.run_number }}
        run: python3 backend/testing/api_flows.py

      # Бахшҳое, ки ҳеҷ гоҳ даст нахӯрда буданд: иваз кардани парол,
      # таърихи воридшавӣ, ҷавоб ба шарҳи Reel, реаксия ба паём,
      # маҷмӯа, дӯстони наздик, ҷавоби худкор, промокод, гурӯҳ.
      # Маҳз ин санҷиш ошкор кард, ки реаксия ба паём сабт мешуд,
      # вале ҳеҷ гоҳ бармегашт.
      - name: Санҷиши бахшҳои дастнорасида
        env:
          BASE: http://127.0.0.1:8099
          SUFFIX: ci${{ github.run_number }}
        run: python3 backend/testing/api_user2.py

      # Ҷустуҷӯ, explore, Live, танзимоти лента, студияи муаллиф.
      # Ин санҷиш ошкор кард, ки бегона метавонист «эфирро хотима
      # диҳад» — сервер 200 мегуфт, ҳол он ки эфир давом дошт.
      - name: Санҷиши кашф, Live ва лента
        env:
          BASE: http://127.0.0.1:8099
          SUFFIX: ci${{ github.run_number }}
        run: python3 backend/testing/api_user3.py

      # Функсияҳои нави чат: таҳрир, forward, пин (то 3), хомӯш.
      - name: Санҷиши чат
        env:
          BASE: http://127.0.0.1:8099
          SUFFIX: ci${{ github.run_number }}
        run: python3 backend/testing/api_chat.py

      # Стикерҳои сторис: савол, викторина, слайдер, ҳисоби баръакс.
      - name: Санҷиши стикерҳо
        env:
          BASE: http://127.0.0.1:8099
          SUFFIX: ci${{ github.run_number }}
        run: python3 backend/testing/api_stickers.py

      # Ҳисоби пӯшида дар ҲАМАИ ҷойҳо. Пеш аз ислоҳ: 12/27 —
      # 15 рахна, аз ҷумла пешнамоиши линк БЕ ВУРУД.
      - name: Санҷиши ҳисоби пӯшида
        env:
          BASE: http://127.0.0.1:8099
          SUFFIX: ci${{ github.run_number }}
        run: python3 backend/testing/api_privacy2.py

      # Лентаи «Обунаҳо» ва «Дӯстдоштаҳо».
      - name: Санҷиши дӯстдоштаҳо
        env:
          BASE: http://127.0.0.1:8099
          SUFFIX: ci${{ github.run_number }}
        run: python3 backend/testing/api_favorites.py

      # Ҷонишинҳо дар профил ва Alt text-и расм.
      - name: Санҷиши ҷонишин ва alt
        env:
          BASE: http://127.0.0.1:8099
          SUFFIX: ci${{ github.run_number }}
        run: python3 backend/testing/api_profile_a11y.py

      # «Лайкҳо пинҳон» ва «шарҳҳо хомӯш» дар ҲАР экран.
      - name: Санҷиши пинҳон кардан
        env:
          BASE: http://127.0.0.1:8099
          SUFFIX: ci${{ github.run_number }}
        run: python3 backend/testing/api_hide.py

      # Ҳалқаи сторис: «дида шуд» ҳам барои соҳиб.
      - name: Санҷиши ҳалқаи сторис
        env:
          BASE: http://127.0.0.1:8099
          SUFFIX: ci${{ github.run_number }}
        run: python3 backend/testing/api_story_seen.py

      # Ҳалқаи сторис — як ҳолат дар лента, reels, профил, explore,
      # ҷустуҷӯ, шарҳҳо ва чат (hasStory / hasUnseenStory / storySeen).
      - name: Санҷиши ҳалқаи сторис дар ҳамаи экранҳо
        env:
          BASE: http://127.0.0.1:8099
          SUFFIX: ci${{ github.run_number }}
        run: python3 backend/testing/api_story_ring.py

      # Занг: канал < 64 байт, ҳарду тараф як канал, бастагон занг намезананд.
      - name: Санҷиши занг ва Live token
        env:
          BASE: http://127.0.0.1:8099
          SUFFIX: ci${{ github.run_number }}
        run: python3 backend/testing/api_calls.py

      # Ҷавоби худкор: ба чати дорои таърих ҳам, як бор дар 24 соат.
      - name: Санҷиши ҷавоби худкор
        env:
          BASE: http://127.0.0.1:8099
          SUFFIX: ci${{ github.run_number }}
        run: python3 backend/testing/api_autoreply.py

      # Паёми худкор ба Direct аз рӯи калимаи шарҳ (ManyChat).
      - name: Санҷиши паёми худкор аз шарҳ
        env:
          BASE: http://127.0.0.1:8099
          SUFFIX: ci${{ github.run_number }}
        run: python3 backend/testing/api_autodm.py

      # Notes: реаксия, ҷавоб ба Direct, блок ва обуна.
      - name: Санҷиши реаксияҳои Notes
        env:
          BASE: http://127.0.0.1:8099
          SUFFIX: ci${{ github.run_number }}
        run: python3 backend/testing/api_note_reactions.py

      # Ҳамкорӣ (даъват/қабул/баромадан/хориҷ) ва «Илова ба сториси худ».
      - name: Санҷиши ҳамкорӣ ва зикр дар сторис
        env:
          BASE: http://127.0.0.1:8099
          SUFFIX: ci${{ github.run_number }}
        run: python3 backend/testing/api_collab_mention.py

      # Бейҷи паёмҳои хонданашуда: хондан то паёми дидашуда (upTo),
      # шумораи ҳар чат ва бейҷи умумӣ (бе дархост/хомӯш).
      - name: Санҷиши ҳисоби паёмҳои хонданашуда
        env:
          BASE: http://127.0.0.1:8099
          SUFFIX: ci${{ github.run_number }}
        run: python3 backend/testing/api_unread.py

      # Саҳифабандӣ (профил, шарҳ, огоҳинома, ҳаштаг, обуначиён),
      # тахфифи маҳсул дар лента, бекор кардани «Ҷолиб нест», Live.
      - name: Санҷиши саҳифабандӣ ва тахфифи маҳсул
        env:
          BASE: http://127.0.0.1:8099
          SUFFIX: ci${{ github.run_number }}
        run: python3 backend/testing/api_paging_shop.py

      # «Навбати ту» (Add Yours): занҷир, мавзӯъ, иштирокчиён, блок.
      - name: Санҷиши «Навбати ту»
        env:
          BASE: http://127.0.0.1:8099
          SUFFIX: ci${{ github.run_number }}
        run: python3 backend/testing/api_addyours.py

      # Хатоҳои аудит: обунаи маҷбурӣ, ситораи қалбакӣ, телефони бегона,
      # иҷозати шарҳ, чати бегона, бекор кардани token, бинандагони Live.
      - name: Санҷиши амният
        env:
          BASE: http://127.0.0.1:8099
          SUFFIX: ci${{ github.run_number }}
        run: python3 backend/testing/api_security.py

      # Даври дуюм: номи админ, рамзи барқарорӣ, телефон, лимитҳо,
      # мағоза, гурӯҳ, саҳифабандӣ, нест кардани ҳисоб.
      - name: Санҷиши амният 2
        env:
          BASE: http://127.0.0.1:8099
          SUFFIX: ci${{ github.run_number }}
        run: python3 backend/testing/api_security2.py

      # Барқарорсозии ҳисоб: ёфтан (ном/почта/телефон), рамз, қуфл баъди
      # 5 кӯшиш, token-и якдафъаина, бекор шудани сессияҳо, «Кӯмак лозим»
      # → admin. DATABASE_URL — барои admin кардани корбари санҷишӣ (psql).
      - name: Санҷиши барқарорсозии ҳисоб
        env:
          BASE: http://127.0.0.1:8099
          SUFFIX: ci${{ github.run_number }}
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/raonson?sslmode=disable
        run: python3 backend/testing/api_recover.py

      # Модератсия: сервери ДУЮМ бо provider-и расми қалбакӣ (stub-и
      # маҳаллӣ дар 127.0.0.1:8096, ки худи санҷиш мекушояд). Ҳеҷ калиди
      # ҳақиқӣ нест: provider ва Safe Browsing ба stub ишора мекунанд.
      # Сервери асосӣ (8099) бе provider мемонад — ҳолати «расм
      # санҷида намешавад, ба навбати admin меравад» ҳам санҷида мешавад.
      - name: Сервери дуюм барои модератсияи расм
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/raonson?sslmode=disable
          JWT_SECRET: ci-only-not-a-real-secret
          JWT_REFRESH_SECRET: ci-only-not-a-real-secret-2
          PORT: '8097'
          GIN_MODE: debug
          RATE_LIMIT_MULTIPLIER: '50'
          MODERATION_IMAGE_URL: http://127.0.0.1:8096/hf
          MEDIA_ALLOWED_HOSTS: 127.0.0.1:8096
          MEDIA_ALLOW_HTTP: '1'
          SAFE_BROWSING_KEY: ci-stub-not-a-real-key
          MODERATION_SAFE_BROWSING_URL: http://127.0.0.1:8096/sb
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null 2>&1 || true
          /tmp/raonson-server > /tmp/server-mod.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8097/health > /dev/null 2>&1; then
              echo "сервери дуюм тайёр"; exit 0
            fi
            sleep 2
          done
          tail -50 /tmp/server-mod.log
          exit 1

      # 18+ / дашном / линкҳо → 403; шубҳанок → пинҳон; 3 огоҳӣ →
      # маҳдудкунӣ; admin: навбат, тасдиқ, барқарорсозӣ, бан; расм ва
      # кадрҳои видео тавассути classifier-и қалбакӣ.
      - name: Санҷиши модератсия
        env:
          BASE: http://127.0.0.1:8099
          IMG_BASE: http://127.0.0.1:8097
          MOD_STUB_PORT: '8096'
          SUFFIX: ci${{ github.run_number }}
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/raonson?sslmode=disable
        run: python3 backend/testing/api_moderation.py

      # Майдонҳое, ки барнома мехонад, воқеан аз сервер меоянд.
      - name: Санҷиши мувофиқати маълумот
        env:
          BASE: http://127.0.0.1:8099
          SUFFIX: ci${{ github.run_number }}
        run: python3 backend/testing/api_contract.py

      # Як пост/Reel — ҳамон рақамҳо дар ҳамаи экранҳо.
      - name: Санҷиши якхелагӣ дар ҳамаи экранҳо
        env:
          BASE: http://127.0.0.1:8099
          SUFFIX: ci${{ github.run_number }}
        run: python3 backend/testing/api_consistency.py

      - name: Log-и сервер
        if: always()
        run: tail -120 /tmp/server.log

      - name: Log-и сервери модератсия
        if: always()
        run: tail -60 /tmp/server-mod.log || true
