name: Debug APK (санҷиши блокҳои демо)

# APK-и DEBUG барои ташхиси дархостии дастгирии Yandex.
#
# Чаро workflow-и алоҳида: ҳамаи workflow-ҳои дигар `--release`
# месозанд, вале тугмаҳои демо дар release ҚАСДАН пинҳонанд
# (ad_config.dart: `isDebugBuild && kDebugMode`). Яъне аз APK-и
# release ин тугмаҳоро дидан ҒАЙРИИМКОН аст.
#
# ⚠️ APK-и debug бо калиди debug имзо мешавад. Android иҷозат
# намедиҳад, ки он ба ҷои APK-и release насб шавад — аввал
# барномаи ҷориро нест кардан лозим аст.
#
# Шиносаҳои production ин ҷо ДОДА НАМЕШАВАНД ва лозим ҳам нестанд:
# дар build-и debug AdConfig ҳамеша шиносаҳои демоиро бармегардонад.

on:
  workflow_dispatch:
  push:
    branches: [claude/profile-settings-home-feed-N5ct0]
    paths:
      - 'lib/core/ads/**'
      - '.github/workflows/debug-apk.yml'

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Flutter pub get
        run: flutter pub get

      # Нусхаи SDK маҳз он чизест, ки дастгирии Yandex талаб кард.
      # Агар он 8.4.0 набошад, APK сохтан маъно надорад.
      - name: Check Yandex SDK version
        run: |
          echo "── pubspec.lock ──"
          grep -A 3 '^  yandex_mobileads:' pubspec.lock
          if ! grep -A 3 '^  yandex_mobileads:' pubspec.lock \
               | grep -q 'version: "8.4.0"'; then
            echo "::error::плагин 8.4.0 нест"
            exit 1
          fi
          # Плагин ва SDK-и натив нусхаҳои ҷудогона доранд. Роҳи
          # плагин аз package_config.json гирифта мешавад — он
          # ҳамеша дуруст аст, новобаста аз ҷои кэш.
          ROOT=$(python3 -c "
          import json, urllib.parse
          cfg = json.load(open('.dart_tool/package_config.json'))
          p = next(p for p in cfg['packages']
                   if p['name'] == 'yandex_mobileads')
          print(urllib.parse.urlparse(p['rootUri']).path)
          ")
          echo "── SDK-и натив ──"
          grep 'com.yandex.android:mobileads' "$ROOT/android/build.gradle"
          grep -q 'com.yandex.android:mobileads:8.4.0' \
            "$ROOT/android/build.gradle" || {
            echo "::error::SDK-и натив 8.4.0 нест"; exit 1; }

      - name: Flutter test
        run: flutter test

      # Танҳо DEBUG. Дар он kDebugMode=true, пас тугмаҳои демо
      # намоён мешаванд ва AdConfig шиносаҳои демоиро медиҳад.
      - name: Build DEBUG APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: raonson-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
