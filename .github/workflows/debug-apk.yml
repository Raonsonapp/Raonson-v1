name: Debug APK (санҷиши блокҳои демо)

# APK-и DEBUG барои ташхиси дархостии дастгирии Yandex.
#
# Чаро workflow-и алоҳида: ҳамаи workflow-ҳои дигар `--release`
# месозанд, вале тугмаҳои демо дар release ҚАСДАН пинҳонанд
# (ad_config.dart: `isDebugBuild && kDebugMode`). Яъне аз APK-и
# release ин тугмаҳоро дидан ҒАЙРИИМКОН аст.
#
# ⚠️ APK-и debug бо калиди debug имзо мешавад. Android иҷозат
# намедиҳад, ки он ба ҷои APK-и release насб шавад — аввал
# барномаи ҷориро нест кардан лозим аст.
#
# Шиносаҳои production ин ҷо ДОДА НАМЕШАВАНД ва лозим ҳам нестанд:
# дар build-и debug AdConfig ҳамеша шиносаҳои демоиро бармегардонад.

on:
  workflow_dispatch:
  push:
    branches: [claude/profile-settings-home-feed-N5ct0]
    paths:
      - 'lib/core/ads/**'
      - '.github/workflows/debug-apk.yml'

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Flutter pub get
        run: flutter pub get

      # Дастгирии Yandex гуфт: реклама АЗ 8.4.0 САР КАРДА мувофиқ
      # мешавад. Яъне талаб «на камтар аз 8.4.0» аст, на «маҳз
      # 8.4.0» — санҷиши қаблӣ баробариро талаб мекард ва build
      # ҳамон рӯзе афтод, ки Yandex 8.5.0-ро баровард.
      - name: Check Yandex SDK version
        run: |
          python3 - <<'EOF'
          import json, re, sys, urllib.parse

          MIN_STR = '8.4.0'

          def parse(v):
              # `pub` танҳо рақамҳо ва пасванди -beta мебарорад;
              # муқоисаи сатрӣ '8.10.0' < '8.4.0' медиҳад — ғалат.
              head = re.split(r'[-+]', v)[0]
              return tuple(int(x) for x in head.split('.'))

          MIN = parse(MIN_STR)

          # ── 1. Нусхаи ҲАЛШУДАи плагин ──
          #
          # Сабти pubspec.lock ҳашт сатр аст ва `version:` дар охири
          # он меояд. `grep -A 3` онро намебинад — маҳз ҳамин build-и
          # аввалро шикаст.
          lock = open('pubspec.lock').read()
          m = re.search(
              r'^  yandex_mobileads:\n(?:    .*\n|      .*\n)*',
              lock, re.M)
          if not m:
              sys.exit('::error::yandex_mobileads дар pubspec.lock нест')
          block = m.group(0)
          print('── pubspec.lock ──')
          print(block.rstrip())
          v = re.search(r'version: "([^"]+)"', block)
          if not v:
              sys.exit('::error::нусхаи плагин хонда нашуд')
          plugin_v = v.group(1)
          if parse(plugin_v) < MIN:
              sys.exit(f'::error::плагин {plugin_v} аст, на камтар аз 8.4.0 лозим')

          # ── 2. Нусхаи SDK-и НАТИВ ──
          #
          # Плагин ва SDK-и натив нусхаҳои ҷудогона доранд; дастгирии
          # Yandex маҳз дар бораи SDK-и натив гуфт.
          cfg = json.load(open('.dart_tool/package_config.json'))
          pkg = next(p for p in cfg['packages']
                     if p['name'] == 'yandex_mobileads')
          root = urllib.parse.urlparse(pkg['rootUri']).path
          gradle = open(f'{root}/android/build.gradle').read()
          line = next((l.strip() for l in gradle.splitlines()
                       if 'com.yandex.android:mobileads' in l), None)
          print('── SDK-и натив ──')
          print(line)
          nv = re.search(r'mobileads:([0-9]+(?:\.[0-9]+)*)', line or '')
          if not nv:
              sys.exit('::error::нусхаи SDK-и натив хонда нашуд')
          if parse(nv.group(1)) < MIN:
              sys.exit(f'::error::SDK-и натив {nv.group(1)} аст, '
                       f'на камтар аз {MIN_STR} лозим')

          print(f'✅ плагин {plugin_v}, SDK-и натив {nv.group(1)} '
                f'(ҳадди ақал {MIN_STR})')
          EOF

      - name: Flutter test
        run: flutter test

      # Калиди Agora ба APK-и санҷишӣ ҳам лозим аст — вагарна занг
      # дар худи ҳамон build-е, ки барои санҷиш медиҳем, кор
      # намекунад ва мо гумон мекунем, ки коди занг вайрон аст.
      - name: Create .env for dart-define
        env:
          AGORA_APP_ID: ${{ secrets.AGORA_APP_ID }}
        run: |
          printf 'AGORA_APP_ID=%s\nBASE_URL=https://mahmadmurodov-raonson.hf.space\n' \
            "$AGORA_APP_ID" > .env
          if [ -z "$AGORA_APP_ID" ]; then
            echo "::warning::AGORA_APP_ID нест — занг дар ин APK кор намекунад"
          fi

      # Танҳо DEBUG. Дар он kDebugMode=true, пас тугмаҳои демо
      # намоён мешаванд ва AdConfig шиносаҳои демоиро медиҳад.
      - name: Build DEBUG APK
        run: |
          flutter build apk --debug \
            --dart-define-from-file=.env \
            --dart-define-from-file=dart_defines/ad_units.json

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: raonson-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
