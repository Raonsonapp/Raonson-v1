name: Release AAB (signed)

# Release-и имзошуда барои Google Play.
# Мануалӣ оғоз кунед (Actions → Release AAB → Run workflow) ё бо tag "v*".
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Check secrets are set
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::KEYSTORE_BASE64 secret НЕСТ! Settings → Secrets and variables → Actions → New repository secret → KEYSTORE_BASE64-ро илова кунед (+ STORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS)."
            exit 1
          fi
          echo "✅ Secrets мавҷуданд"

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/raonson-release.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=raonson-release.jks
          EOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Build signed release AAB
        run: flutter build appbundle --release

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Upload AAB (for Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
