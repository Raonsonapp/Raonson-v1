name: Flutter Full Build (Analyze + APK)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =============================
      # 1. CHECKOUT
      # =============================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =============================
      # 2. SETUP JAVA (required for Android build)
      # =============================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # =============================
      # 3. SETUP FLUTTER
      # =============================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      # =============================
      # 4. FLUTTER VERSION
      # =============================
      - name: Flutter version
        run: flutter --version

      # =============================
      # 5. GET DEPENDENCIES
      # =============================
      - name: Flutter pub get
        run: flutter pub get

      # =============================
      # 6. ANALYZE (ERRORS ONLY)
      # =============================
      - name: Flutter analyze (errors only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # =============================
      # 7. RUN TESTS (SKIP IF NONE)
      # =============================
      - name: Flutter test
        run: |
          if [ -d "test" ]; then
            flutter test
          else
            echo "No tests found, skipping."
          fi

      # =============================
      # 7.5 SETUP RELEASE SIGNING
      # =============================
      - name: Setup release signing
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.jks
          printf 'storeFile=release-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties

      # =============================
      # 8. BUILD APK (RELEASE)
      # =============================
      - name: Build APK (release)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: flutter build apk --release

      # =============================
      # 8.1 BUILD AAB (RELEASE)
      # =============================
      - name: Build AAB (release)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: flutter build appbundle --release

      # =============================
      # 9. UPLOAD APK ARTIFACT
      # =============================
      - name: Upload APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: raonson-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # =============================
      # 9.1 UPLOAD AAB ARTIFACT
      # =============================
      - name: Upload AAB
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: raonson-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
