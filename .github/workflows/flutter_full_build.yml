name: Flutter Full Build (Analyze + APK)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =============================
      # 1. CHECKOUT
      # =============================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =============================
      # 2. SETUP JAVA (required for Android build)
      # =============================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # =============================
      # 3. SETUP FLUTTER
      # =============================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      # =============================
      # 4. FLUTTER VERSION
      # =============================
      - name: Flutter version
        run: flutter --version

      # =============================
      # 5. GET DEPENDENCIES
      # =============================
      - name: Flutter pub get
        run: flutter pub get

      # =============================
      # 6. ANALYZE (ERRORS ONLY)
      # =============================
      - name: Flutter analyze (errors only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # =============================
      # 7. RUN TESTS (SKIP IF NONE)
      # =============================
      - name: Flutter test
        run: |
          if [ -d "test" ]; then
            flutter test
          else
            echo "No tests found, skipping."
          fi

      # Санҷишҳои реклама ду роҳи ҷудогона доранд: бе шиноса (боло) ва
      # бо шиносаи воқеии build-и production. Қадами болоӣ танҳо роҳи
      # якумро месанҷад.
      - name: Flutter test (шиносаҳои реклама)
        run: |
          flutter test --dart-define-from-file=dart_defines/ad_units.json \
            test/ad_config_test.dart test/ad_units_file_test.dart \
            test/ads_debug_test.dart

      # =============================
      # 7.4 CREATE .env (dart-define secrets)
      # =============================
      - name: Create .env for dart-define
        env:
          AGORA_APP_ID: ${{ secrets.AGORA_APP_ID }}
        run: |
          printf 'AGORA_APP_ID=%s\nBASE_URL=https://mahmadmurodov-raonson.hf.space\n' \
            "$AGORA_APP_ID" > .env

      # =============================
      # 7.5 SETUP RELEASE SIGNING
      # =============================
      #
      # ⚠️ Ин ҷо `if: ${{ secrets.… }}` навишта шуда буд.
      #
      # Контексти `secrets` дар `if:` ИҶОЗАТ ДОДА НАМЕШАВАД — он
      # танҳо дар `env:` ва `with:` кор мекунад. GitHub худи
      # workflow-ро рад мекард: run месохт, вале ҳеҷ job оғоз
      # намешуд ва он дар 0 сония «афтид».
      #
      # Яъне ин build ҲАРГИЗ иҷро нашуда буд — на analyze, на тест,
      # на APK. Дар рӯйхат танҳо сурхии сабабнофаҳмо менамуд.
      #
      # Ҳал: калид дар ҚАДАМ санҷида мешавад ва натиҷа ҳамчун
      # output мемонад. `steps.*.outputs` дар `if:` кор мекунад.
      - name: Санҷиши калиди имзо
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE_BASE64 нест — APK/AAB сохта намешавад"
          fi

      # ⚠️ Ин ҷо `secrets.KEYSTORE_PASSWORD` навишта шуда буд.
      #
      # Чунин сирр вуҷуд НАДОРАД. Дар `release.yml`, ки кор мекунад,
      # ном `STORE_PASSWORD` аст. Сирри набуда ба сатри ХОЛӢ табдил
      # мешавад — ва Gradle мегӯяд:
      #
      #   KeytoolException: keystore password was incorrect
      #
      # Ин ҳеҷ гоҳ дида нашуда буд, чунки худи workflow ҳатто оғоз
      # намешуд (ниг. қадами «Санҷиши калиди имзо»).
      #
      # Акнун ҳамон номи `release.yml` гирифта мешавад; агар касе
      # номи дигарро гузошта бошад, он ҳам қабул мешавад.
      - name: Setup release signing
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.jks
          STORE_PW="${STORE_PASSWORD:-$KEYSTORE_PASSWORD}"
          if [ -z "$STORE_PW" ]; then
            echo "::error::STORE_PASSWORD (ё KEYSTORE_PASSWORD) нест — имзо намешавад"
            exit 1
          fi
          printf 'storeFile=release-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PW" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties

      # =============================
      # 8. BUILD APK (RELEASE)
      # =============================
      # ⚠️ APK-и ЯГОНА 177 МБ буд.
      #
      # Сабаб дар acc ё расм НЕСТ — ҳамаи assets 1.7 МБ аст. Вазн аз
      # китобхонаҳои НАТИВӢ меояд (Agora RTC, video_compress,
      # video_player), ва APK-и оддӣ онҳоро барои ҲАМАИ меъморӣ
      # якбора дар бар мегирад.
      #
      # `android/app/build.gradle.kts` аллакай тақсимро дастгирӣ
      # мекунад, вале он бо `SPLIT_PER_ABI` хомӯш буд.
      #
      # Акнун ду APK сохта мешавад — `arm64-v8a` (қариб ҳамаи
      # телефонҳои нав) ва `armeabi-v7a` (кӯҳнаҳо). Ҳар яке хеле
      # сабуктар аст.
      #
      # AAB даст намехӯрад: Google Play худаш барои ҳар телефон
      # тақсим мекунад.
      - name: Build APK (release, per-ABI)
        if: steps.signing.outputs.ready == 'true'
        env:
          SPLIT_PER_ABI: 'true'
        run: |
          flutter build apk --release --dart-define-from-file=.env \
            --dart-define-from-file=dart_defines/ad_units.json
          echo "── ҳаҷми APK-ҳо ──"
          ls -lh build/app/outputs/flutter-apk/*.apk | awk '{print $5, $9}'

      # =============================
      # 8.1 BUILD AAB (RELEASE)
      # =============================
      - name: Build AAB (release)
        if: steps.signing.outputs.ready == 'true'
        run: |
          flutter build appbundle --release --dart-define-from-file=.env \
            --dart-define-from-file=dart_defines/ad_units.json

      # =============================
      # 9. UPLOAD APK ARTIFACT
      # =============================
      - name: Upload APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: raonson-release-apk
          # Бо тақсим ном `app-arm64-v8a-release.apk` ва
          # `app-armeabi-v7a-release.apk` мешавад, на `app-release.apk`.
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error

      # =============================
      # 9.1 UPLOAD AAB ARTIFACT
      # =============================
      - name: Upload AAB
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: raonson-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
