name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Танзими ном ва email барои Git
          git config --global user.email "bot@github.com"
          git config --global user.name "GitHub Action"
          
          # Тоза кардани пайвастҳои кӯҳна ва илова кардани линки нав бо Токен
          git remote rm hf || true
          git remote add hf https://mahmadmurodov:$HF_TOKEN@huggingface.co/spaces/Mahmadmurodov/raonson
          
          # Маҷбуран партофтани бянчи main
          git push hf main --force
