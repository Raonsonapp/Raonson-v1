name: Sync Backend to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'Dockerfile'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:  # Дастӣ низ иҷро кардан мумкин

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install huggingface_hub
        run: pip install huggingface_hub==0.23.4

      - name: Deploy to Hugging Face (with retry)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - << 'PYEOF'
          import time
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])

          # Retry логика — 500 хато муваққатӣ аст
          max_retries = 5
          for attempt in range(1, max_retries + 1):
              try:
                  print(f"Attempt {attempt}/{max_retries}...")
                  api.upload_folder(
                      folder_path="backend",
                      repo_id="Mahmadmurodov/raonson",
                      repo_type="space",
                      commit_message=f"Deploy backend - attempt {attempt}",
                      ignore_patterns=["*.tmp", "__pycache__", ".git"],
                  )
                  print("✅ Deploy successful!")
                  break
              except Exception as e:
                  print(f"❌ Attempt {attempt} failed: {e}")
                  if attempt < max_retries:
                      wait = 30 * attempt  # 30s, 60s, 90s, 120s
                      print(f"⏳ Waiting {wait}s before retry...")
                      time.sleep(wait)
                  else:
                      print("💥 All attempts failed!")
                      raise
          PYEOF
