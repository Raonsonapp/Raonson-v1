name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "GitHub Action"
          
          # Танзими Git LFS барои суратҳо ва шрифтҳо
          git lfs install
          git lfs track "*.png"
          git lfs track "*.ttf"
          git add .gitattributes
          
          # Агар ягон тағйирот бошад, сабт мекунад
          git commit -m "Configure LFS for binaries" || true
          
          # Боркунии ниҳоӣ
          git push --force https://Mahmadmurodov:$HF_TOKEN@huggingface.co/spaces/Mahmadmurodov/raonson main:main
