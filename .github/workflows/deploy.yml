name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # 1. Танзими Java ва Flutter барои Сборка
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 2. Тайёр кардани файлҳои Веб
      - name: Build Flutter Web
        run: |
          flutter pub get
          flutter build web --release

      # 3. Танзими Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Hugging Face Hub
        run: pip install huggingface_hub

      # 4. Фристодани ТАНҲО папкаи тайёри Веб ба Hugging Face
      - name: Upload to Hugging Face via API
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import HfApi
          api = HfApi()
          api.upload_folder(
              folder_path='build/web',
              repo_id='Mahmadmurodov/raonson-web',
              repo_type='space',
              token='${{ secrets.HF_TOKEN }}'
          )
          "
